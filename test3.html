<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizontal Box with Left Image</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }


        .box {
            width: 90%;
            max-width: 950px;
            height: 220px;
            background-color: #ffffff;
            border: 4px solid #4a4a4a;


            background-image: url('nike_sneaker.png');
            background-repeat: no-repeat;
            background-position: bottom left;

            background-size: cover;

        }
    </style>
</head>

<body>

    <!-- Horizontal Box -->
    <div class="box"></div>

</body>

</html>
