<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Cards</title>
    <style>
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        body {
            background-color: #f4f4f4;
            padding: 40px 20px;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        /* Container for Cards */
        .card-container {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        /* Single Card Styling */
        .card {
            width: 280px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* Product Image */
        .card img {
            width: 100%;
            height: 180px;
            object-fit: contain;
            background-color: #f9f9f9;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        /* Product Title */
        .card h3 {
            font-size: 18px;
            color: #333;
            margin-bottom: 8px;
        }

        /* Category Label */
        .category {
            font-size: 12px;
            color: #ff6b00;
            font-weight: bold;
            margin-bottom: 10px;
        }

        /* Price */
        .price {
            font-size: 18px;
            font-weight: bold;
            color: #111;
            margin-bottom: 15px;
        }

        /* Add to Cart Button */
        .btn {
            width: 100%;
            padding: 10px;
            background-color: #111;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #333;
        }
    </style>
</head>

<body>

    <h2>Product Cards</h2>

    <div class="card-container">

        <!-- Card 1 -->
        <div class="card">
            <img src="nike_sneaker.png" alt="Nike Shoe">
            <h3>Nike Air Max 270</h3>
            <p class="category">WOMEN SHOES</p>
            <p class="price">$139.99</p>
            <button class="btn">Add to Cart</button>
        </div>

        <!-- Card 2 -->
        <div class="card">
            <img src="nike_sneaker.png" alt="Nike Shoe">
            <h3>Nike Air Max 270</h3>
            <p class="category">WOMEN SHOES</p>
            <p class="price">$139.99</p>
            <button class="btn">Add to Cart</button>
        </div>

        <!-- Card 3 -->
        <div class="card">
            <img src="nike_sneaker.png" alt="Nike Shoe">
            <h3>Nike Air Max 270</h3>
            <p class="category">WOMEN SHOES</p>
            <p class="price">$139.99</p>
            <button class="btn">Add to Cart</button>
        </div>

    </div>

</body>

</html>
