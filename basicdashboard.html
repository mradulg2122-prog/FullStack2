<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        padding: 30px;
    }

    .dashboard {
        max-width: 800px;
        margin: auto;
        background-color: white;
        padding: 15px;
        border-radius: 8px;
    }

    /* Header */
    header {
        height: 70px;
        background-color: #d9f1ff;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 25px;
        border-radius: 6px;
    }

    header h2 {
        font-size: 20px;
    }

    header button {
        padding: 8px 15px;
        border: none;
        border-radius: 5px;
        background-color: #e8d85c;
    }

    /* Main Layout */
    .main-layout {
        display: flex;
        gap: 10px;
        margin-top: 10px;
    }

    /* Sidebar */
    aside {
        width: 25%;
        min-height: 300px;
        background-color: #dfffe9;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 6px;
    }

    aside h3 {
        color: #555;
    }

    /* Main */
    main {
        width: 75%;
    }

    /* Main Content */
    .main-content {
        height: 150px;
        background-color: #edffd9;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 6px;
    }

    .main-content h2 {
        color: #555;
    }

    /* Cards */
    .cards {
        display: flex;
        gap: 10px;
        margin-top: 10px;
    }

    .card {
        width: 50%;
        height: 80px;
        background-color: #f0eef2;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 6px;
    }

    .card h3 {
        color: #666;
    }

    /* Footer */
    footer {
        height: 55px;
        background-color: #d9f1ff;
        margin-top: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 6px;
    }

    footer p {
        color: #555;
    }
</style>

<body>

    <div class="dashboard">

        <header>
            <h2>MY DASHBOARD</h2>
            <button>EXIT</button>
        </header>

        <div class="main-layout">

            <aside>
                <h3>SIDEBAR</h3>
            </aside>

            <main>
                <section class="main-content">
                    <h2>MAIN CONTENT</h2>
                </section>

                <div class="cards">
                    <div class="card">
                        <h3>CARD 1</h3>
                    </div>

                    <div class="card">
                        <h3>CARD 2</h3>
                    </div>
                </div>
            </main>

        </div>

        <footer>
            <p>Footer</p>
        </footer>

    </div>

</body>

</html>
