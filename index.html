<!-- create a 3 card design using html and css basic design-->
<!-- use css for design -->

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 Card design</title>
    <style>
        .container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            column-gap: 3%;
            align-items: center;
            flex-wrap: wrap;
            /* background-color: #f5f5f5; */
        }

        .box {
            height: 100px;
            min-width: 150px;
            max-width: 300px;
            margin-top: 3%
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box" style="background-color: aqua"></div>
        <div class="box" style="background-color: burlywood"></div>
        <div class="box" style="background-color: cornsilk"></div>
        <div class="box" style="background-color: rgb(81, 44, 190)"></div>
        <div class="box" style="background-color: rgb(68, 230, 248)"></div>
        <div class="box" style="background-color: rgb(241, 97, 255)"></div>



</body>

</html>
