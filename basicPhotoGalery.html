<!DOCTYPE html>
<html>

<head>
    <title>Basic Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #eeeeee;
        font-family: Arial, sans-serif;

        display: flex;
        justify-content: center;
        align-items: center;
    }

    .gallery-container {
        width: 600px;
        background: white;
        padding: 25px;
        border-radius: 8px;
    }

    .heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

    .heading h2 {
        font-size: 20px;
        margin: 0;
        color: #333;
    }

    .gallery {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
    }

    .box {
        height: 90px;
        background: #e6e0ff;
        border-radius: 6px;

        display: flex;
        justify-content: center;
        align-items: center;

        color: #555;
        font-size: 16px;
    }

    .box:hover {
        background: #d5ccff;
    }
</style>

<body>

    <div class="gallery-container">
        <div class="heading">
            <h2 align="center">MY PHOTO GALLERY</h2>
        </div>

        <div class="gallery">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">4</div>
            <div class="box">5</div>
            <div class="box">6</div>
            <div class="box">7</div>
            <div class="box">8</div>
            <div class="box">9</div>
            <div class="box">10</div>
            <div class="box">11</div>
            <div class="box">12</div>
        </div>
    </div>

</body>

</html>
